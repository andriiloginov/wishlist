<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вішліст на день народження</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500&family=Figtree:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { bg: "var(--bg)", panel: "var(--panel)", ink: "var(--ink)", muted: "var(--muted)", line: "var(--line)", soft: "var(--soft)", accent: "var(--accent)", "accent-line": "var(--accent-line)" },
    fontFamily: {
      display: ['"Archivo"', "Helvetica", "Arial", "sans-serif"],
      body: ['"Figtree"', "Helvetica", "Arial", "sans-serif"],
      mono: ['"JetBrains Mono"', "ui-monospace", "Menlo", "monospace"],
    },
  } } };
</script>
<style>
  /* Layout: framed center column with hairline rules, cover tiles on a 1px grid, graph-paper strips between sections */
  :root { --bg:#e2e4dd; --panel:#fff; --ink:#0b0c0d; --muted:#5b636c; --line:#9aa2aa; --soft:#d0d2c8; --accent:#ffb200; --accent-line:#bd8209; color-scheme: light; }
  body { background: var(--bg); color: var(--ink); margin: 0; }
  [hidden] { display: none !important; }
  .font-display { font-stretch: 125%; }
  .grid-bg { background-image: linear-gradient(var(--soft) 1px, transparent 1px), linear-gradient(90deg, var(--soft) 1px, transparent 1px); background-size: 22px 22px; background-position: -1px -1px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="mx-auto min-h-screen max-w-5xl border-x border-line bg-panel font-body antialiased" style="padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)">
  <header class="border-b border-line px-4 pb-12 pt-14 text-center sm:px-8 sm:pb-16 sm:pt-20">
    <img src="avatar.jpg" alt="Аватар" width="96" height="96" class="mx-auto h-24 w-24 rounded-full border border-line object-cover">
    <h1 class="mt-5 font-display text-2xl font-medium leading-tight sm:text-3xl">Вішліст</h1>
    <p class="mx-auto mt-5 max-w-xl text-base text-muted sm:text-lg">Оберіть гру й натисніть «В магазин», щоб відкрити її сторінку.</p>
    <p class="mx-auto mt-3 max-w-xl text-sm text-muted">RetroMagaz на сусідній вулиці від мене, тож можна забрати й особисто.</p>
    <a href="https://www.google.com/maps/place/RetroMagaz/@50.4453954,30.5051435,17z/data=!4m6!3m5!1s0x40d4c4513baf8719:0xb98b713fca6e77a9!8m2!3d50.445386!4d30.5077231" target="_blank" rel="noopener" class="mt-4 inline-flex items-center gap-1 rounded-full border border-line bg-panel px-3 py-1.5 font-mono text-xs uppercase tracking-wide transition hover:border-ink focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">Магазин на карті ↗</a>
  </header>
  <nav id="chips" aria-label="Платформи" class="flex flex-wrap justify-center gap-2 border-b border-line px-4 py-4"></nav>
  <div class="grid-bg h-10 border-b border-line bg-bg"></div>
  <ul id="list" class="grid grid-cols-2 overflow-hidden bg-panel sm:grid-cols-3"></ul>
  <div class="grid-bg h-10 border-t border-line bg-bg"></div>
</div>
<script>
  const R = "https://retromagaz.com/product/", I = "https://retromagaz.com/uploads/products/";
  const ITEMS = [
    { id: "zelda-la-dx", img: I + "a7/02/site_g7hfdd7m5_7f5c7235.png", title: "The Legend of Zelda: Link's Awakening DX", note: "Game Boy, тільки картридж", price: "3 749 ₴", link: R + "gra-nintendo-game-boy-the-legend-of-zelda-links-awakening-dx-je-zberezennia-angliiska-versiia-tilki-kartridz-bu" },
    { id: "lotr-rotk", img: I + "b2/14/site_f4nu58nsm_f6cfac86.png", title: "The Lord of the Rings: The Return of the King", note: "PlayStation 2", price: "849 ₴", link: R + "ps2-igra-lord-of-the-rings-return-of-the-king-e-orig-bu" },
    { id: "sims-2", img: I + "42/99/site_er9a92ko9_2f77a667.png", title: "The Sims 2", note: "PlayStation 2", price: "199 ₴", link: R + "ps2-igra-sims-2-e-orig-bu" },
    { id: "max-payne", img: I + "eb/67/site_erflqdci6_d65687bc.png", title: "Max Payne", note: "PlayStation 2", price: "1 099 ₴", link: R + "ps2-igra-max-payne-e-orig-bu" },
    { id: "ecco-tides", img: I + "c6/8b/site_g4tpaukps_9c301fc2.png", title: "Ecco: The Tides of Time", note: "Sega Mega Drive", price: "1 849 ₴", link: R + "gra-sega-mega-drive-ecco-the-tides-of-time-usa-angliiska-versiia-bu" },
    { id: "toejam-earl", img: I + "68/37/site_g06i6n6hl_cf600dc6.png", title: "ToeJam & Earl in Panic on Funkotron", note: "Sega Mega Drive", price: "1 699 ₴", link: R + "gra-sega-mega-drive-toejam-earl-in-panic-on-funkotron-europe-angliiska-versiia-bu" },
    { id: "dkc-2", img: I + "bc/26/site_g52nngu9a_bd935e71.png", title: "Donkey Kong Country 2", note: "Game Boy Advance, тільки картридж", price: "1 499 ₴", link: R + "gra-nintendo-game-boy-advance-donkey-kong-country-2-angliiska-versiia-tilki-kartridz-bu" },
    { id: "spyro-2", img: I + "dd/e9/site_g52okv09s_3430f273.png", title: "Spyro 2: Season of Flame", note: "Game Boy Advance, тільки картридж", price: "699 ₴", link: R + "gra-nintendo-game-boy-advance-spyro-2-season-of-flame-angliiska-versiia-tilki-kartridz-bu" },
    { id: "shrek-2", img: I + "30/04/site_g6m335m1a_89d9cb47.png", title: "Shrek 2", note: "Game Boy Advance", price: "1 099 ₴", link: R + "gra-nintendo-game-boy-advance-shrek-2-angliiska-versiia-bu" },
    { id: "millionaire", img: I + "fb/61/site_g6hcpkrpr_26dff36d.png", title: "Who Wants to Be a Millionaire", note: "PlayStation 1", price: "699 ₴", link: R + "gra-sony-playstation-1-who-wants-to-be-a-millionaire-europe-angliiska-versiia-bu" },
    { id: "micro-machines-v3", img: I + "56/1a/site_g6lc5h19o_e22ca517.png", title: "Micro Machines V3", note: "PlayStation 1", price: "999 ₴", link: R + "gra-sony-playstation-1-micro-machines-v3-europe-angliiska-versiia-bu" },
    { id: "resident-evil-2", img: I + "b4/30/site_g36895cm9_4f42facd.png", title: "Resident Evil 2", note: "PlayStation 1, 2 диски", price: "2 999 ₴", link: R + "gra-sony-playstation-1-resident-evil-2-biohazard-2-europe-angliiska-versiia-bu" },
    { id: "dk-land", img: I + "20/da/site_g7cngr157_35318104.png", title: "Donkey Kong Land", note: "Game Boy, тільки картридж", price: "899 ₴", link: R + "gra-nintendo-game-boy-donkey-kong-land-angliiska-versiia-tilki-kartridz-bu" },
    { id: "tmnt-gba", img: I + "6d/d2/site_ga190tl06_37ce9dd7.png", title: "Teenage Mutant Ninja Turtles", note: "Game Boy Advance, тільки картридж", price: "1 199 ₴", link: R + "gra-nintendo-game-boy-advance-teenage-mutant-ninja-turtles-angliiska-versiia-tilki-kartridz-vzivanii" },
  ];
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const link = (e, href) => { e.href = href; e.target = "_blank"; e.rel = "noopener"; return e; };
  for (const g of ITEMS) {
    const li = el("li", "group flex min-w-0 flex-col p-3 shadow-[1px_1px_0_0_var(--line)] sm:p-5");
    const cover = link(el("a", "grid-bg block aspect-[410/520] max-w-full overflow-hidden border border-line bg-bg"), g.link);
    cover.tabIndex = -1;
    const img = el("img", "h-full w-full object-contain p-3 transition-transform duration-200 group-hover:scale-[1.03]");
    img.src = g.img; img.alt = g.title; img.loading = "lazy";
    cover.append(img);
    const tag = el("p", "mt-4 font-mono text-[11px] uppercase tracking-wider text-muted", g.note);
    const name = el("p", "mt-1 font-medium leading-snug [overflow-wrap:anywhere]");
    name.append(link(el("a", "hover:underline hover:underline-offset-4", g.title), g.link));
    const foot = el("div", "mt-auto flex flex-wrap items-center justify-between gap-2 pt-4");
    foot.append(
      el("span", "font-mono text-sm tabular-nums", g.price),
      link(el("a", "inline-flex items-center gap-1 rounded-full border border-accent-line bg-accent px-3 py-1.5 font-mono text-xs font-medium uppercase tracking-wide text-black transition hover:brightness-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink", "В магазин ↗"), g.link),
    );
    li.append(cover, tag, name, foot);
    document.getElementById("list").append(li);
  }

  // Фільтр: платформа = текст нотатки до першої коми
  const platformOf = (g) => g.note.split(",")[0].trim();
  const cards = [...document.getElementById("list").children];
  const CHIP = "rounded-full border px-3 py-1 font-mono text-xs uppercase tracking-wide transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink";
  const ON = " border-ink bg-ink text-panel", OFF = " border-line bg-panel text-ink hover:border-ink";
  const chips = document.getElementById("chips");
  const select = (p) => {
    cards.forEach((li, i) => { li.hidden = p !== null && platformOf(ITEMS[i]) !== p; });
    for (const b of chips.children) { const on = b.dataset.p === String(p); b.className = CHIP + (on ? ON : OFF); b.setAttribute("aria-pressed", on); }
  };
  for (const p of [null, ...new Set(ITEMS.map(platformOf))]) {
    const n = p === null ? ITEMS.length : ITEMS.filter((g) => platformOf(g) === p).length;
    const b = el("button", null, (p ?? "Усі") + " · " + n);
    b.type = "button"; b.dataset.p = String(p);
    b.addEventListener("click", () => select(p));
    chips.append(b);
  }
  select(null);
</script>
</body>
</html>
